<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <style>
    /* Default (Midnight Indigo) theme variables */
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --success: #10b981;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Amber Sunset theme */
    body[data-theme="amber"] {
      --primary: #f59e0b;
      --primary-hover: #d97706;
      --bg: #120d0a;
      --card-bg: rgba(35, 26, 20, 0.75);
    }

    /* Emerald Forest theme */
    body[data-theme="emerald"] {
      --primary: #10b981;
      --primary-hover: #059669;
      --bg: #06100e;
      --card-bg: rgba(14, 33, 29, 0.75);
    }

    /* Aura Purple theme */
    body[data-theme="purple"] {
      --primary: #a855f7;
      --primary-hover: #9333ea;
      --bg: #0f0b1a;
      --card-bg: rgba(27, 19, 44, 0.75);
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 290px;
      padding: 18px;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s ease;
    }

    .container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      backdrop-filter: blur(16px);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      box-sizing: border-box;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
    }
    
    .brand-name {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff, var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .brand-logo {
      width: 24px;
      height: 24px;
      transition: stroke 0.3s ease;
    }

    .form-group {
      margin-bottom: 12px;
      position: relative;
    }
    
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    /* --- AKILLI ARAMA DROPDOWN STİLLERİ --- */
    .custom-select-wrapper {
      position: relative;
      width: 100%;
      user-select: none;
    }
    
    .custom-select-trigger {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
      transition: var(--transition);
      box-sizing: border-box;
      height: 40px;
    }
    
    .custom-select-trigger:hover {
      border-color: var(--primary);
    }
    
    .custom-select-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-top: 6px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      z-index: 100;
      display: none;
      flex-direction: column;
      max-height: 220px;
      overflow: hidden;
      box-sizing: border-box;
    }
    
    .custom-select-search {
      padding: 6px;
      background: #0f172a;
      border-bottom: 1px solid var(--border);
    }
    
    .custom-select-search input {
      width: 100%;
      padding: 6px 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      color: #fff;
      font-size: 13px;
      outline: none;
      box-sizing: border-box;
    }
    
    .custom-select-options {
      overflow-y: auto;
      flex: 1;
      max-height: 160px;
    }
    
    .custom-select-option {
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
      color: #cbd5e1;
    }
    
    .custom-select-option:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--primary);
    }
    
    .custom-select-option.selected {
      background: var(--primary);
      color: #fff;
    }
    
    .custom-select-wrapper.open .custom-select-dropdown {
      display: flex;
    }

    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
    }
    
    .toggle-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-top: 1px solid var(--border);
      margin-top: 12px;
    }

    .toggle-label {
      font-size: 13px;
      font-weight: 500;
      color: #e2e8f0;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(255, 255, 255, 0.1);
      transition: .3s ease;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s ease;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--primary);
    }

    input:checked + .slider:before {
      transform: translateX(18px);
    }

    .btn-secondary {
      width: 100%;
      padding: 10px;
      margin-top: 16px;
      background: rgba(255, 255, 255, 0.04);
      color: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .status-toast {
      font-size: 12px;
      color: var(--success);
      text-align: center;
      margin-top: 8px;
      opacity: 0;
      transition: opacity 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-weight: 600;
    }

    .status-toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">
      <svg class="brand-logo" fill="none" viewBox="0 0 24 24" stroke="var(--primary)" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 21a.75.75 0 0 1-.75-.75V3.75a.75.75 0 0 1 1.5 0v16.5a.75.75 0 0 1-.75.75z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 12h16.5a.75.75 0 0 1 0 1.5H3.75a.75.75 0 0 1 0-1.5z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="m16.5 7.5 3 3-3 3M7.5 16.5l-3-3 3-3" />
      </svg>
      <div class="brand-name">ÇevirmenX</div>
    </div>
    
    <div class="form-group">
      <label for="kaynakDilContainer" id="lblKaynakDil">Kaynak Dil (Source)</label>
      <div id="kaynakDilContainer"></div>
    </div>
    
    <div class="form-group">
      <label for="hedefDilContainer" id="lblHedefDil">Hedef Dil (Target)</label>
      <div id="hedefDilContainer"></div>
    </div>

    <div class="toggle-group">
      <span class="toggle-label">Çeviri Balonu Göster</span>
      <label class="switch">
        <input type="checkbox" id="balonGosterToggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-group">
      <span class="toggle-label">Özel Sözlük Etkin</span>
      <label class="switch">
        <input type="checkbox" id="sozlukCevirisiEtkinToggle" checked>
        <span class="slider"></span>
      </label>
    </div>
    
    <div id="statusToast" class="status-toast">
      <span>✓ Ayarlar Kaydedildi</span>
    </div>

    <button id="ayarlarBtn" class="btn-secondary">
      <svg style="width: 14px; height: 14px;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
      <span>Yönetim Paneli</span>
    </button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
